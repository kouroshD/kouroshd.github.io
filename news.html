<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>News - Kourosh Darvish</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <style>
        .news-item {
            display: flex;
            gap: 20px;
            align-items: flex-start;
        }

        .news-media-container {
            flex-shrink: 0;
            width: 150px;
            height: 100px;
            position: relative;
            border-radius: 6px;
            overflow: hidden;
            background-color: var(--bg-secondary);
        }

        .news-media {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .news-play-button {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 36px;
            color: white;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.8);
            pointer-events: none;
        }

        .news-content {
            flex: 1;
            min-width: 0;
        }

        @media (max-width: 768px) {
            .news-item {
                flex-direction: column;
            }

            .news-media-container {
                width: 100%;
                height: 150px;
            }
        }
    </style>
</head>

<nav class="main-nav" aria-label="Primary">
    <div class="nav-container">
        <a href="index.html" aria-label="Home"><i class="fas fa-home" aria-hidden="true"></i><span>Home</span></a>
        <a href="about.html" aria-label="About"><i class="fas fa-user" aria-hidden="true"></i><span>About</span></a>
        <a href="research.html" aria-label="Research"><i class="fas fa-robot"
                aria-hidden="true"></i><span>Research</span></a>
        <a href="publications.html" aria-label="Publications"><i class="fas fa-book"
                aria-hidden="true"></i><span>Publications</span></a>
        <a href="news.html" aria-label="News"><i class="fas fa-newspaper" aria-hidden="true"></i><span>News</span></a>
        <button class="theme-toggle" onclick="toggleTheme()" aria-label="Toggle theme" aria-pressed="false">
            <span id="theme-icon">🌙</span>
        </button>
    </div>
</nav>

<body>

    <div class="container">
        <header style="border-bottom: 2px solid var(--border); padding-bottom: 20px; margin-bottom: 30px;">
            <h1>News & Updates</h1>
        </header>

        <main>
            <section>
                <h2>All News</h2>
                <p style="color: var(--text-secondary); margin-bottom: 20px;">
                    Latest updates, publications, talks, and announcements
                </p>

                <div id="all-news" class="news-list">
                    <p style="color: var(--text-secondary);">Loading news...</p>
                </div>
            </section>
        </main>

        <footer>
            <p>Last updated: <span id="last-updated"></span> | © <span id="current-year"></span> Kourosh Darvish</p>
        </footer>
    </div>

    <script src="js/main.js"></script>
    <script>
        async function loadAllNews() {
            try {
                const response = await fetch('data/news.json');
                const data = await response.json();
                const newsContainer = document.getElementById('all-news');

                let items = Array.isArray(data.news) ? data.news : Array.isArray(data) ? data : [];
                items = items.filter(item => !item.hidden);

                if (items.length === 0) {
                    newsContainer.innerHTML = '<p style="color: var(--text-secondary);">No news yet.</p>';
                    // Fallback: show today as last updated
                    setLastUpdated(new Date());
                    return;
                }

                // Render all news
                const newsHTML = items.map(item => createNewsHTML(item)).join('');
                newsContainer.innerHTML = newsHTML;

                // Determine latest date among items
                const parseDate = (s) => {
                    if (!s) return 0;
                    let t = Date.parse(s);
                    if (!isNaN(t)) return t;
                    t = Date.parse('1 ' + s);
                    return isNaN(t) ? 0 : t;
                };
                const latestTs = items.reduce((max, item) => Math.max(max, parseDate(item.date)), 0);
                const latestDate = latestTs ? new Date(latestTs) : new Date();
                setLastUpdated(latestDate);
            } catch (error) {
                console.error('Error loading news:', error);
                document.getElementById('all-news').innerHTML = '<p style="color: var(--text-secondary);">Unable to load news.</p>';
                // Still show today's date so footer isn't blank
                setLastUpdated(new Date());
            }
        }

        function setLastUpdated(dateObj) {
            const el = document.getElementById('last-updated');
            if (!el) return;
            el.textContent = dateObj.toLocaleDateString('en-US', {
                year: 'numeric',
                month: 'short',
                day: 'numeric'
            });
        }

        function createNewsHTML(item) {
            let mediaHTML = '';

            // Add media if available
            if (item.media_link && item.media_type) {
                if (item.media_type === 'video') {
                    mediaHTML = `
                        <div class="news-media-container">
                            <img src="${getVideoThumbnail(item.media_link)}" alt="${item.title}" class="news-media">
                            <div class="news-play-button">▶</div>
                        </div>
                    `;
                } else if (item.media_type === 'image') {
                    mediaHTML = `
                        <div class="news-media-container">
                            <img src="${item.media_link}" alt="${item.title}" class="news-media">
                        </div>
                    `;
                }
            }

            const linkHTML = item.link ? `<a href="${item.link}" target="_blank" style="font-size: 12px; margin-top: 8px; display: inline-block;">→ read more</a>` : '';

            return `
                <div class="news-item">
                    ${mediaHTML}
                    <div class="news-content">
                        <div class="date">${item.date}</div>
                        <div class="title">${item.title}</div>
                        ${item.description ? `<div class="description">${item.description}</div>` : ''}
                        ${linkHTML}
                    </div>
                </div>
            `;
        }

        function getVideoThumbnail(videoUrl) {
            if (videoUrl.includes('youtube.com') || videoUrl.includes('youtu.be')) {
                const videoId = videoUrl.split('v=')[1]?.split('&')[0] || videoUrl.split('/').pop();
                return `https://img.youtube.com/vi/${videoId}/maxresdefault.jpg`;
            }
            return videoUrl;
        }

        document.addEventListener('DOMContentLoaded', loadAllNews);
    </script>
</body>

</html>
