name: Update Publications

on:
  schedule:
    - cron: '0 0 * * *'  # Run daily at midnight UTC
  workflow_dispatch:  # Allow manual triggering

jobs:
  update-publications:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v2
      with:
        fetch-depth: 0

    - name: Set Git Config
      run: |
        git config --global user.name "Kourosh Darvish"
        git config --global user.email "kourosh.darvish@gmail.com"
    
    - name: Set up Python
      uses: actions/setup-python@v2
      with:
        python-version: '3.x'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install scholarly
    
    - name: Run update script
      env:
        SCHOLAR_ID: ${{ secrets.SCHOLAR_ID }}
      run: python .github/workflows/fetch_scholar.py
    
    - name: Check for changes
      id: changes
      run: |
        if [[ -n "$(git status --porcelain)" ]]; then
          echo "changes=true" >> $GITHUB_OUTPUT
        else
          echo "changes=false" >> $GITHUB_OUTPUT
        fi
    
    - name: Create Pull Request
      if: steps.changes.outputs.changes == 'true'
      uses: peter-evans/create-pull-request@v5
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        commit-message: Update publications from Google Scholar
        title: 'Update: New publications found'
        body: |
          Automated update from Google Scholar
          
          - Updated publications.json with new entries
          - Added new publications to news.json
          
          Please review the changes and merge if they look correct.
        branch: update-publications
        delete-branch: true
        author: Kourosh Darvish <kourosh.darvish@gmail.com>
        committer: Kourosh Darvish <kourosh.darvish@gmail.com>